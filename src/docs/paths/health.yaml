/api/v1/health:
  get:
    tags:
      - Health
    summary: Check API health
    description: Returns the current API and database health status.
    responses:
      "200":
        description: API and database are healthy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthResponse"

      "503":
        description: API is running but the database is unavailable.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthResponse"
